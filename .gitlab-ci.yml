# --------------------DOCKER-------------------------
.docker-job-template:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$docker_password" | docker login -u "$docker_user" --password-stdin
    - TAG="v$CI_PIPELINE_IID"
    - docker build --build-arg SERVICE_NAME=$SERVICE_NAME -t $docker_user/$SERVICE_NAME:$TAG -t $docker_user/$SERVICE_NAME:latest .
    - docker push $docker_user/$SERVICE_NAME:$TAG
    - docker push $docker_user/$SERVICE_NAME:latest

docker-api-gateway:
  extends: .docker-job-template
  variables:
    SERVICE_NAME: "api-gateway"
  needs:
    - job: build-api-gateway
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - api-gateway/**/*
        - common-dto/**/*
        - pom.xml

