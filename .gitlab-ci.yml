stages:
  - build
  - docker

# --------------------BUILD-------------------------
.build-app-template:
  stage: build
  image: maven:3.9.9-amazoncorretto-21
  cache:
    paths:
      - .m2/repository
  script:
    - mvn clean package -pl $SERVICE_NAME -am -DskipTests
  artifacts:
    paths:
      - $SERVICE_NAME/target/*.jar
    expire_in: 1 hour

build-api-gateway:
  extends: .build-app-template
  variables:
    SERVICE_NAME: "api-gateway"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - api-gateway/**/*
        - common-dto/**/*
        - pom.xml

build-common-dto:
  extends: .build-app-template
  variables:
    SERVICE_NAME: "common-dto"
  rules:
