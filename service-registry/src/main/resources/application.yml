server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka

management:
  endpoints:
    web:
      exposure:
        include: "refresh,health,info"