services:


  postgres-db:
    image: pgvector/pgvector:pg17-trixie
    container_name: microservices_postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    networks:
      - keycloak-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: hotel_db
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.0-alpine
    container_name: mpm-handover-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight-ui
    ports:
      - "6380:8001"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

  zookeeper:
    container_name: mpm-handover-zookeeper
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/data
    networks:
      - messaging-network

  kafka:
    container_name: mpm-handover-kafka
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://127.0.0.1:9092
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/kafka
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - messaging-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-mpm-handover-10
    ports:
      - "9093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - messaging-network
  uit-server-registry:
    image: haichuong/service-registry:latest
    container_name: server-registry
    environment:
      EUREKA_PORT: 8761
      LOGSTASH_HOST: logstash
    ports:
      - "8761:8761"
    depends_on:
      - logstash
    networks:
      - optimize-network

  uit-config-server:
    image: haichuong/config-server:latest
    container_name: config-server
    environment:
      CONFIG_SERVER_PORT: 8888
      GIT_URI: https://gitlab.com/chuonggiang2209/config-server-files.git
      GIT_LABEL: main
      GIT_USERNAME: chuonggiang2209
      GIT_PASSWORD: glpat-Eq3GDNI3QTkEduupgbD5smM6MQpvOjEKdTpuZXV5cw8.01.17153zrr9
      EUREKA_HOST: http://uit-server-registry
      EUREKA_PORT: 8761
      LOGSTASH_HOST: logstash
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8888:8888"
    depends_on:
      - uit-server-registry
      - logstash
    networks:
      - optimize-network

  uit-keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: uit-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: example
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    command: start-dev
    ports:
      - "8083:8080"
    depends_on:
      - postgres-db
    networks:
      - keycloak-network

  elasticsearch:
    container_name: uit-elasticsearch
    image: elasticsearch:7.17.10
    platform: linux/amd64
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - optimize-network

  logstash:
    container_name: uit-logstash
    image: logstash:7.17.10
    platform: linux/amd64
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    networks:
      - optimize-network
    depends_on:
      - elasticsearch

  kibana:
    container_name: kb-container
    image: kibana:7.17.10
    platform: linux/amd64
    environment:
      - ELASTICSEARCH_HOSTS=http://uit-elasticsearch:9200
    networks:
      - optimize-network
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

volumes:
  pg-data:
  zookeeper-data:
  kafka-data:
  redis-data:
  redis-insight-data:
networks:
  keycloak-network:
  optimize-network:
  messaging-network: